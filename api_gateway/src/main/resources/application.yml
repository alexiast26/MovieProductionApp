server:
  port: 8080

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: http://user-service:8081
            predicates:
              - Path=/api/users/**

          - id: movie-service
            uri: http://movie-service:8082
            predicates:
              - Path=/api/movies/**

          - id: staff-service
            uri: http://staff-service:8083
            predicates:
              - Path=/api/staff/**

          - id: notification-service
            uri: http://notification-service:8084
            predicates:
              - Path=/api/notifications/**

          - id: report-service
            uri: http://report-service:8085
            predicates:
              - Path=/api/reports/**